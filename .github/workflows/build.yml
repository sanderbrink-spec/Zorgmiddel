name: ZorgSamen APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ZorgSamen ZIP zoeken
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname 'ZorgSamen*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Geen ZorgSamen ZIP gevonden."
            exit 1
          fi
          echo "Gevonden: $ZIP"
          mkdir -p build-source
          unzip -q "$ZIP" -d build-source

      - name: Android project vinden
        run: |
          echo "Projectstructuur:"
          find build-source -maxdepth 4 -type f | head -100

      - name: APK bouwen
        run: |
          PROJECT=$(find build-source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Geen Android Gradle project gevonden."
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "Android project: $DIR"

          cd "$DIR"
          gradle assembleDebug --no-daemon

      - name: APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: ZorgSamen-APK
          path: |
            build-source/**/app/build/outputs/apk/debug/*.apk
            build-source/**/build/outputs/apk/debug/*.apk
